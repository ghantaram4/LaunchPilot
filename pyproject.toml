[build-system]
requires = ["setuptools>=70,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpilot"
version = "0.1.0"
description = "Independent, evidence-backed college-event GTM agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1,<2", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-openai>=1,<2", "chromadb>=1,<2", "sentence-transformers>=5,<6",
  "transformers>=4.41,<5", "streamlit>=1.40,<2", "pypdf>=6,<7", "filelock>=3,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["launchpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.test-tmp"
markers = ["integration: local embedding/Chroma integration; no paid generation"]

[tool.ruff]
line-length = 110
extend-exclude = [".cache", ".venv", ".test-tmp", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
